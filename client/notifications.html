<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications — Socially</title>

    <link rel="icon" type="image/png" href="assets/images/Socially_Logo.png">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/notifications.css">
</head>

<body>

    <!-- ============================================================
         NAVBAR
    ============================================================ -->

    <header class="navbar">

        <a class="brand" href="index.html">
            <div class="brand-icon">S</div>
            <span>Socially</span>
        </a>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input
                type="text"
                id="searchInput"
                placeholder="Search Socially..."
                autocomplete="off"
            >
        </div>

        <div class="nav-actions">

            <button class="icon-btn" id="themeToggle" title="Toggle theme">
                🌙
            </button>

            <a class="icon-btn active" href="notifications.html" title="Notifications">
                🔔
                <span class="notification-count" id="navNotifCount" hidden>0</span>
            </a>

            <a class="profile-btn" href="profile.html?id=u1" id="profileBtn">
                <div class="avatar small-avatar">S</div>
                <span>Saad</span>
            </a>

        </div>

    </header>


    <!-- ============================================================
         NOTIFICATIONS PAGE
    ============================================================ -->

    <main class="notifications-page">

        <div class="notifications-header">

            <div>
                <h1>Notifications</h1>
                <p>Stay up to date with your activity</p>
            </div>

            <div class="notifications-actions">
                <button class="secondary-button" id="markAllReadBtn">
                    ✓ Mark all read
                </button>
                <button class="danger-outline-btn" id="clearAllBtn">
                    🗑️ Clear all
                </button>
            </div>

        </div>


        <!-- LOADING -->
        <div class="notif-loading" id="notifLoading">
            <div class="spinner"></div>
            <p>Loading notifications…</p>
        </div>


        <!-- EMPTY -->
        <div class="notif-empty" id="notifEmpty" hidden>
            <div class="empty-icon">🔔</div>
            <h3>No notifications yet</h3>
            <p>When someone likes or comments on your posts, you'll see it here.</p>
            <a href="index.html" class="primary-button">← Back to feed</a>
        </div>


        <!-- LIST (rendered by notifications.js) -->
        <div class="notif-list" id="notifList" hidden></div>

    </main>


    <!-- ============================================================
         SCRIPTS
    ============================================================ -->

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/app.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/websocket.js"></script>

</body>
</html>
